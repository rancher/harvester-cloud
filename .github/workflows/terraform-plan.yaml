name: Terraform Validation & Plan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  gcp_terraform_plan:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.6"
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
      - name: Initialize Terraform
        run: terraform init
        working-directory: projects/google-cloud/
      - name: Run Terraform Plan
        run: terraform plan -no-color | tee plan_output.log
        working-directory: projects/google-cloud/
      - name: Check for Warnings
        run: |
          if grep -q "Warning:" projects/google-cloud/plan_output.log; then
            echo "::error title=Terraform Warnings Found::Terraform plan generated warnings in GCP project."
            exit 1
          fi
  azure_terraform_plan:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.6"
      - name: Authenticate to Azure
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          creds: '${{ secrets.AZURE_CREDENTIALS }}'
      - name: Initialize Terraform
        run: terraform init
        working-directory: projects/azure/
      - name: Run Terraform Plan
        run: terraform plan -no-color -var "subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" | tee plan_output.log
        working-directory: projects/azure/
      - name: Check for Warnings
        run: |
          if grep -q "Warning:" projects/azure/plan_output.log; then
            echo "::error title=Terraform Warnings Found::Terraform plan generated warnings in Azure project."
            exit 1
          fi
  digitalocean_terraform_plan:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.6"
      - name: Initialize Terraform
        run: terraform init
        working-directory: projects/digitalocean/
      - name: Run Terraform Plan
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
        run: terraform plan -no-color -var "do_token=$DIGITALOCEAN_TOKEN" | tee plan_output.log
        working-directory: projects/digitalocean/
      - name: Check for Warnings
        run: |
          if grep -q "Warning:" projects/digitalocean/plan_output.log; then
            echo "::error title=Terraform Warnings Found::Terraform plan generated warnings in DigitalOcean project."
            exit 1
          fi
  aws_terraform_plan:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.6"
      - name: Authenticate to AWS Cloud
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Initialize Terraform
        run: terraform init
        working-directory: projects/aws/
      - name: Run Terraform Plan
        run: terraform plan -no-color | tee plan_output.log
        working-directory: projects/aws/
      - name: Check for Warnings
        run: |
          if grep -q "Warning:" projects/aws/plan_output.log; then
            echo "::error title=Terraform Warnings Found::Terraform plan generated warnings in AWS project."
            exit 1
          fi
