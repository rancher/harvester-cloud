      - name: Run benchmark on nested Harvester VMs
        working-directory: projects/google-cloud
        run: |
          set -euo pipefail

          KEY_FILE="${PREFIX}-ssh_private_key.pem"

          ssh \
            -o StrictHostKeyChecking=no \
            -i "${KEY_FILE}" \
            opensuse@"${INSTANCE_IP}" \
            HARVESTER_PASSWORD="${HARVESTER_PASSWORD}" bash -s <<'EOF'

          set -euo pipefail

          echo "Running benchmarks using precomputed node list..."

          mkdir -p /tmp/benchmark-results

          if [ ! -f /tmp/nodes.txt ]; then
            echo "nodes.txt not found! Aborting."
            exit 1
          fi

          mapfile -t NODES < /tmp/nodes.txt

          for NODE in "${NODES[@]}"; do

            read -r VM IP <<< "${NODE}"

            echo ""
            echo "=============================="
            echo "VM: ${VM} -> ${IP}"
            echo "=============================="

            echo "Copying benchmark script..."

            sshpass -p "${HARVESTER_PASSWORD}" \
              ssh \
                -o StrictHostKeyChecking=no \
                rancher@"${IP}" \
                'cat >/tmp/benchmarks.sh && chmod +x /tmp/benchmarks.sh' \
                < /tmp/benchmarks.sh

            echo "Running benchmark..."

            sshpass -p "${HARVESTER_PASSWORD}" \
              ssh \
                -n \
                -o StrictHostKeyChecking=no \
                rancher@"${IP}" \
                "sudo /tmp/benchmarks.sh" \
                | tee "/tmp/benchmark-results/${VM}.log"

            echo "Benchmark completed on ${VM}"

          done

          echo ""
          echo "All benchmarks completed."

          EOF
      - name: Collect benchmark results
        working-directory: projects/google-cloud
        run: |
          set -euo pipefail

          KEY_FILE="${PREFIX}-ssh_private_key.pem"

          mkdir -p benchmark-results

          scp \
            -o StrictHostKeyChecking=no \
            -i "${KEY_FILE}" \
            -r \
            opensuse@"${INSTANCE_IP}":/tmp/benchmark-results/. \
            benchmark-results/

          echo "Contents:"
          find .
          echo ""
          find benchmark-results
          echo ""
          ls -lah benchmark-results
      - name: Build Gemini prompt
        working-directory: projects/google-cloud
        run: |
          cp ../../tests/performance-analysis/ai_prompt.md prompt.md

          echo "" >> prompt.md
          echo "---" >> prompt.md
          echo "# Benchmark results" >> prompt.md
          echo "" >> prompt.md

          for f in benchmark-results/*.log; do
            echo "## $(basename "$f")" >> prompt.md
            cat "$f" >> prompt.md
            echo "" >> prompt.md
          done
          cat prompt.md
      - name: Analyze benchmark with Gemini
        id: gemini_analysis
        working-directory: projects/google-cloud
        run: |
          jq -n \
            --rawfile prompt prompt.md \
            '{
              contents: [
                {
                  parts: [
                    {
                      text: $prompt
                    }
                  ]
                }
              ]
            }' > request.json

          RESPONSE=$(curl -s \
            -X POST \
            -H "Content-Type: application/json" \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${{ secrets.GEMINI_API_KEY }}" \
            -d @request.json)

          echo "$RESPONSE" > gemini_response.json

          OUTPUT=$(jq -r '.candidates[0].content.parts[0].text // empty' gemini_response.json)

          if [ -z "$OUTPUT" ]; then
            echo "ERROR: Empty response from Gemini"
            cat gemini_response.json
            exit 1
          fi

          {
            echo "output<<EOF"
            echo "$OUTPUT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Publish benchmark report
        if: always()
        run: |
          echo "## Harvester Cluster Performance Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.gemini_analysis.outputs.output }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Terraform Destroy
        if: always()
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          terraform destroy -auto-approve \
            -var "prefix=${PREFIX}" \
            -var "project_id=${GCP_PROJECT_ID}" \
            -var "harvester_node_count=3" \
            -var "harvester_password=${HARVESTER_PASSWORD}" \
            -var "public_ip_source_addresses=[\"${RUNNER_IP}/32\"]"
        working-directory: projects/google-cloud
