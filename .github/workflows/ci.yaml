name: CI Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
terraform_lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.6"
      - name: Install and verify terraform-docs binary
        run: |
          set -e
          TFDOCS_VERSION="v0.24.0"
          # Defined expected SHA256 checksum for terraform-docs v0.24.0 linux-amd64
          EXPECTED_SHA="9005daf969de0b50134493a2c00078b49f5f5b39d021cda7c89bf4d4f3d776d3"
          # Download binary archive
          curl -sSLo ./terraform-docs.tar.gz "https://github.com/terraform-docs/terraform-docs/releases/download/${TFDOCS_VERSION}/terraform-docs-${TFDOCS_VERSION}-linux-amd64.tar.gz"
          # Double-check SHA256 integrity
          echo "${EXPECTED_SHA}  ./terraform-docs.tar.gz" | sha256sum --check
          # Extract and install binary
          tar -xzf ./terraform-docs.tar.gz terraform-docs
          sudo mv terraform-docs /usr/local/bin/
          rm ./terraform-docs.tar.gz
      - name: Format Terraform files
        run: terraform fmt -recursive .
      - name: Regenerate all docs.md
        run: |
          find . -name docs.md -execdir sh -c 'terraform-docs markdown table . > docs.md' \;
      - name: Commit and push changes if any
        run: |
          git add .
          if ! git diff --cached --quiet; then
            echo "Changes detected in docs.md or .tf files. Committing and pushing..."
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: auto-update terraform-docs and fmt [skip ci]" -m "Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
            git push
          else
            echo "All docs.md and .tf files are already up to date."
          fi

  gcp_terraform_plan:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.6"
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
      - name: Initialize Terraform
        run: terraform init
        working-directory: projects/google-cloud/
      - name: Run Terraform Plan
        run: terraform plan
        working-directory: projects/google-cloud/

  azure_terraform_plan:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.6"
      - name: Authenticate to Azure
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          creds: '${{ secrets.AZURE_CREDENTIALS }}'
      - name: Initialize Terraform
        run: terraform init
        working-directory: projects/azure/
      - name: Run Terraform Plan
        run: terraform plan -var "subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}"
        working-directory: projects/azure/

  digitalocean_terraform_plan:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.6"
      - name: Initialize Terraform
        run: terraform init
        working-directory: projects/digitalocean/
      - name: Run Terraform Plan
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
        run: terraform plan -var "do_token=$DIGITALOCEAN_TOKEN"
        working-directory: projects/digitalocean/

  aws_terraform_plan:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.6"
      - name: Authenticate to AWS Cloud
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Initialize Terraform
        run: terraform init
        working-directory: projects/aws/
      - name: Run Terraform Plan
        run: terraform plan
        working-directory: projects/aws/
