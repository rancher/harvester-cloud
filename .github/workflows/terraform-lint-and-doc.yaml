name: Terraform Lint & Documentation

on:
  pull_request:
    branches:
      - main

jobs:
  terraform_lint_and_doc:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "v1.17.1"
      - name: Install and verify terraform-docs binary
        run: |
          set -e
          TFDOCS_VERSION="v0.24.0"
          # Defined expected SHA256 checksum for terraform-docs v0.24.0 linux-amd64
          EXPECTED_SHA="9005daf969de0b50134493a2c00078b49f5f5b39d021cda7c89bf4d4f3d776d3"
          # Download binary archive
          curl -sSLo ./terraform-docs.tar.gz "https://github.com/terraform-docs/terraform-docs/releases/download/${TFDOCS_VERSION}/terraform-docs-${TFDOCS_VERSION}-linux-amd64.tar.gz"
          # Double-check SHA256 integrity
          echo "${EXPECTED_SHA}  ./terraform-docs.tar.gz" | sha256sum --check
          # Extract and install binary
          tar -xzf ./terraform-docs.tar.gz terraform-docs
          sudo mv terraform-docs /usr/local/bin/
          rm ./terraform-docs.tar.gz
      - name: Format Terraform files
        run: terraform fmt -recursive .
      - name: Regenerate all docs.md
        run: |
          find . -name docs.md -execdir sh -c 'terraform-docs markdown table . > docs.md' \;
      # Internal PR: automatically commit and push documentation and formatting updates
      - name: Commit and push changes if any
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git add .
          if ! git diff --cached --quiet; then
            echo "Changes detected in docs.md or .tf files. Committing and pushing..."
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: auto-update terraform-docs and fmt [skip ci]" -m "Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
            git push origin "HEAD:$GITHUB_HEAD_REF"
          else
            echo "All docs.md and .tf files are already up to date."
          fi
      # Fork PR: GITHUB_TOKEN lacks write permissions to external forks; validate and fail on diff
      - name: Validate formatting and documentation (Fork PR)
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          if ! git diff --quiet; then
            echo "::error title=Uncommitted Changes Detected::Terraform files or docs.md require updates. Please run 'terraform fmt -recursive .' and regenerate docs.md locally, then commit the changes."
            git diff --stat
            exit 1
          fi
